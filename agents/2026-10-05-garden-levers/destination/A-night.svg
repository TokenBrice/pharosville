  <rect class="label" x="332" y="145" width="485" height="82" rx="5"/>
  <text x="348" y="177">G1 Replace the same upper-left discs</text><text x="348" y="208" class="small">Branch gaps remain legible with motion disabled</text>
  <path class="leader" d="M332 204L244 270"/>
  <rect class="label" x="1110" y="145" width="453" height="82" rx="5"/>
  <text x="1126" y="177">K1 Beacon remains dominant</text><text x="1126" y="208" class="small">No lamp necklace; retain tower silhouette</text>
  <path class="leader" d="M1110 212L1018 314"/>
  <rect class="label" x="35" y="445" width="645" height="83" rx="5"/>
  <text x="51" y="477">M1 Cool fill separates garden / water / headland</text><text x="51" y="508" class="small">Dashed patches are material aspirations, not final light ROIs</text>
  <path class="leader" d="M342 528L433 935"/>
  <text x="731" y="757" class="small">K2 Inlet</text><text x="696" y="999" class="small">G2 Approach</text>
  <text x="28" y="1137">G2 Replace bottom 25–30% black bank with shelves, buried triad, recess and a disappearing path.</text>
  <text x="28" y="1175">M1 Recover stone / moss / timber through non-emissive cool fill, never glowing lawn or raised exposure.</text>
  <text x="28" y="1213">Targets: boundary pairs ≥4 L*, materials ≥3 L*, ≥90% approach ≥L*6; sky L*7–15; beacon dominant.</text>
  <text x="28" y="1247" class="small">Fleet envelopes + two gaps are intent. Baseline: outputs/holistic/night.png. No candidate score or measured ROI compliance claimed.</text>
