<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">A — Moss-side observatory: night destination over baseline</title>
  <desc id="desc">The observed night baseline has an almost black bank. Gold annotations replace its geometry and the disc pine; mint preserves the beacon, tower and inlet. Cyan dashed regions request cool non-emissive stone, moss, timber and headland separation, not extra lamps. ROI values are targets, not baseline measurements.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd176"/></marker>
    <style>text{font-family:system-ui,sans-serif;fill:#f6f7fb;font-size:22px}.g{stroke:#ffd176;stroke-width:3;fill:#ffd176;fill-opacity:.06}.keep{stroke:#9bf1c6;stroke-width:3;fill:none}.material{stroke:#88dcff;stroke-width:3;stroke-dasharray:9 7;fill:none}.leader{stroke:#ffd176;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{fill:#121b29;fill-opacity:.94}.small{font-size:19px}</style>
  </defs>
  <rect width="1600" height="1260" fill="#121b29"/>
  <text x="28" y="37" font-size="29">A / Night — same garden, readable planes; no added lamps</text>
  <text x="28" y="75" class="small">Gold: geometric intent   ·   Mint: preserve/clearance   ·   Cyan dashed: aspirational material/light</text>
  <image href="../../../outputs/holistic/night.png" x="0" y="100" width="1600" height="1000"/>
