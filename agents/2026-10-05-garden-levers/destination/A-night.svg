  <path class="keep" d="M690 817L682 752L739 692L844 678L881 718L897 780L1003 826L905 844Z"/>
  <path class="g" d="M70 670L278 590L520 627L685 770L603 805L297 806L88 753Z M375 602L531 591L730 610L851 650L802 690L615 676L425 649Z M1265 653L1460 636L1580 681L1600 837L1450 881L1288 829Z"/>
