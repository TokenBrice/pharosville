  <text x="24" y="778">G3 Replace bottom 25–30% smooth bank with moss shelves, buried triad and recessed gravel.</text>
  <text x="24" y="813">Approach disappears behind stone above K3; crop engawa sill below hulls, not over the inlet.</text>
  <text x="24" y="848">M1 Aspirational: soft moss / damp mineral stone / matte gravel / directional weathered timber.</text>
  <text x="24" y="883">Gate geometry is reprojected, not pixel-pinned. Surface finish and clearance require candidate evidence.</text>
