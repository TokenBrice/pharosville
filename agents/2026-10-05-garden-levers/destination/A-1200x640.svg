<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">A — Moss-side observatory: 1200 by 640 gate annotations</title>
  <desc id="desc">Wide-gate baseline with the pine discs fully visible, broad smooth lower bank, right-of-centre tower, central inlet and a bottom caption. Replace lower bank and pine; keep the path and bounded gravel inset above chrome. Three unequal projected fleet masses retain two water intervals. Surface labels are aspirations.</desc>
