<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">A — Moss-side observatory: daylight destination over baseline</title>
  <desc id="desc">Annotations over the 1600 by 1000 daylight baseline. Replace the smooth lower bank and upper-left disc pine; preserve the right-of-centre tower and open inlet. Three unequal fleet envelopes and two water intervals are geometric intent. Dashed material notes are aspirations, not rendered work.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd176"/></marker>
    <style>text{font-family:system-ui,sans-serif;fill:#f6f7fb;font-size:22px}.g{stroke:#ffd176;stroke-width:3;fill:#ffd176;fill-opacity:.07}.keep{stroke:#9bf1c6;stroke-width:3;fill:none}.material{stroke:#88dcff;stroke-width:3;stroke-dasharray:9 7;fill:none}.leader{stroke:#ffd176;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{fill:#121b29;fill-opacity:.94}.small{font-size:19px}</style>
  </defs>
