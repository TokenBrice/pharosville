  <text x="346" y="178">G1 Replace discs with porous branches</text><text x="346" y="210" class="small">Near framing; keep sky gaps and crown air</text>
  <path class="leader" d="M330 205L252 257"/>
  <rect class="label" x="1110" y="145" width="453" height="83" rx="5"/>
  <text x="1126" y="177">K1 Preserve tower right-of-centre</text><text x="1126" y="208" class="small">Singular hero; do not enlarge garden salience</text>
  <path class="leader" d="M1110 212L1033 282"/>
  <rect class="label" x="25" y="452" width="505" height="76" rx="5"/>
  <text x="41" y="484">G2 Three unequal projected fleet masses</text><text x="41" y="514" class="small">Near-left / rear-left / receding right; legal waters</text>
  <path class="leader" d="M425 528L515 638"/>
  <text x="738" y="757" class="small" fill="#9bf1c6">K2 Inlet</text>
  <text x="296" y="972" class="small">G3 Triad</text><text x="700" y="1030" class="small">G4 Recess</text>
  <text x="28" y="1137">G3 Replace bottom 25–30% bank: moss shelves + buried unequal triad + disappearing approach.</text>
  <text x="28" y="1175">G4 Bound gravel record; crop engawa sill below hull rows. K2 Preserve continuous inlet and two fleet gaps.</text>
  <text x="28" y="1213">M1 Aspirational: damp stone contacts, soft moss, matte gravel, worked timber; neutral noon, no micro-noise.</text>
  <text x="28" y="1247" class="small">Baseline underlay: outputs/holistic/day.png · Outlines are composition intent, not measured clearance or shipped materials.</text>
