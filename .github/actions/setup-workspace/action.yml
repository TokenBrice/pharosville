name: Setup Workspace
description: Install the pinned Node version and a clean PharosVille dependency tree.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json
    - shell: bash
      run: npm ci
