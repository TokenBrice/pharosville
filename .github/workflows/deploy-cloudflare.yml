name: Deploy to Cloudflare Pages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-workspace
      - name: Validate and build
        run: npm run validate
      - uses: actions/upload-artifact@v6
        with:
          name: pharosville-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  visual:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # The Playwright container runs as root while Actions injects a HOME owned
    # by uid 1000. Firefox refuses to launch until HOME points at a root-owned
    # directory.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@v7
        with:
          name: pharosville-dist
          path: dist
      # Hosted runners have no real GPU. These lanes prove the DOM and
      # accessibility fallback in Chromium and Firefox; the pre-push deploy
      # gate owns the full real-GPU visual and performance contracts.
      - name: Built-dist cross-browser DOM and accessibility contract
        run: |
          npm run test:visual:dist:dom
          npm run test:visual:dist:dom:firefox
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: pharosville-visual-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - visual
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@v7
        with:
          name: pharosville-dist
          path: dist
      - name: Deploy Pages
        id: pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.83.0"
          command: >-
            pages deploy dist
            --project-name=pharosville
            --commit-hash=${{ github.sha }}
            --commit-message=${{ github.sha }}
      - name: Verify deployed artifact
        env:
          SMOKE_UI_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          for delay in 0 5 10 15; do
            sleep "$delay"
            if node scripts/pharosville/check-security-headers.mjs --url "$SMOKE_UI_URL" \
              && npm run smoke:live -- --url "$SMOKE_UI_URL"; then
              exit 0
            fi
            echo "Pages deployment is not ready; waiting before the next probe."
          done
          echo "Pages deployment did not become ready within the propagation window." >&2
          exit 1
