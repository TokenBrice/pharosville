name: Canary smoke

# Pings the live PharosVille URL once a day to surface regressions between
# deploys. GitHub emails repo admins on failure by default. PharosVille is a
# side project with no uptime commitment, so a daily check is the honest
# cadence; the deploy workflow runs the same smoke on every push.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    concurrency:
      group: canary-smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-workspace
      - name: Check live security headers
        env:
          SMOKE_UI_URL: ${{ vars.SMOKE_UI_URL || 'https://pharosville.pharos.watch' }}
        run: node scripts/pharosville/check-security-headers.mjs --url "$SMOKE_UI_URL"
      - name: Smoke live with strict freshness
        id: first-smoke
        continue-on-error: true
        env:
          SMOKE_UI_URL: ${{ vars.SMOKE_UI_URL || 'https://pharosville.pharos.watch' }}
        run: npm run smoke:live -- --url "$SMOKE_UI_URL" --strict-freshness
      # A single cadence hiccup should not page; two failed observations five
      # minutes apart should. Deploy workflows retain their warning-only smoke.
      - name: Confirm sustained canary failure
        if: steps.first-smoke.outcome == 'failure'
        env:
          SMOKE_UI_URL: ${{ vars.SMOKE_UI_URL || 'https://pharosville.pharos.watch' }}
        run: |
          sleep 300
          npm run smoke:live -- --url "$SMOKE_UI_URL" --strict-freshness
      # Proves the client-error pipe end to end: without this, /_log could 404
      # or 500 for months and nothing would notice, because the only callers
      # are browsers that have already failed and never report the failure to
      # report the failure. The probe is marked synthetic, so it lands under
      # PHAROSVILLE_CANARY_PROBE and never in the real-error signal.
      - name: Probe client error log endpoint
        id: log-probe
        env:
          SMOKE_UI_URL: ${{ vars.SMOKE_UI_URL || 'https://pharosville.pharos.watch' }}
        run: |
          set -euo pipefail
          origin="${SMOKE_UI_URL%/}"
          headers="$RUNNER_TEMP/log-probe-headers.txt"
          run_token="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(node -e 'console.log(crypto.randomUUID())')"
          echo "run-token=$run_token" >> "$GITHUB_OUTPUT"

          expect_status() {
            if [ "$2" != "$3" ]; then
              echo "::error::/_log $1: expected HTTP $3, got $2"
              exit 1
            fi
          }

          # Both refusals short-circuit before the rate limiter, so neither
          # spends the probe's own budget.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            "$origin/_log")
          expect_status "GET" "$status" "405"

          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST "$origin/_log" \
            -H 'content-type: application/json' \
            -H 'origin: https://example.invalid' \
            --data '{"category":"canary","message":"cross-origin probe"}')
          expect_status "cross-origin POST" "$status" "403"

          post_probe() {
            curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 10 \
              -X POST "$origin/_log" \
              -H 'content-type: application/json' \
              -H "origin: $origin" \
              -H 'x-pharosville-canary: 1' \
              -H "x-pharosville-canary-run: $run_token" \
              -H 'user-agent: pharosville-canary/1 (synthetic; github-actions)' \
              --data "{\"category\":\"canary\",\"message\":\"synthetic canary probe from GitHub Actions run $GITHUB_RUN_ID\",\"ts\":$(date +%s)000}"
          }

          status=$(post_probe)
          if [ "$status" = "429" ]; then
            # An overlapping run landed inside the 10s rate-limit window. Wait it
            # out once: a canary that cries outage over its own second request
            # teaches the operator to ignore the channel.
            sleep 11
            status=$(post_probe)
          fi
          expect_status "synthetic report" "$status" "204"

          if ! grep -qi '^cache-control:[[:space:]]*no-store' "$headers"; then
            echo "::error::/_log accepted the report without cache-control: no-store"
            exit 1
          fi
          storage=$(awk -F ': *' 'tolower($1) == "x-pharosville-storage" {gsub("\r", "", $2); print $2}' "$headers")
          case "$storage" in
            accepted) echo "/_log accepted the synthetic KV write; persistence still needs independent readback." ;;
            not-configured) echo "::notice::KV persistence: not configured (CLIENT_ERROR_KV binding absent); persistence not verified." ;;
            *) echo "::error::/_log synthetic storage failed or its signal is missing"; exit 1 ;;
          esac
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
      - name: Check KV readback credentials
        id: kv-config
        env:
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
          CLIENT_ERROR_KV_NAMESPACE_ID: ${{ secrets.CLIENT_ERROR_KV_NAMESPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_KV_READ_TOKEN" ] && [ -n "$CLIENT_ERROR_KV_NAMESPACE_ID" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::KV readback: not configured (repository read credentials absent); persistence not verified."
          fi
      - name: Read back synthetic KV report
        if: steps.kv-config.outputs.configured == 'true' && steps.log-probe.outputs.storage == 'accepted'
        timeout-minutes: 5
        env:
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
          CLIENT_ERROR_KV_NAMESPACE_ID: ${{ secrets.CLIENT_ERROR_KV_NAMESPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANARY_RUN_TOKEN: ${{ steps.log-probe.outputs.run-token }}
          CANARY_STORAGE: ${{ steps.log-probe.outputs.storage }}
        run: node scripts/pharosville/kv-readback.mjs
